<!doctype html><meta charset="utf-8"><title>Shirts</title>
<style>body{margin:0;background:#8a9099}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
<canvas id="c"></canvas>
<script type="module">
// Test page: both T-shirts, front and back.
import * as THREE from "three";
import { loadCharacterKit, loadCrowdBody, makeCharacter } from "/character.js";
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#9aa3ad");
scene.add(new THREE.HemisphereLight("#dfe9ff", "#6b5a48", 1.6));
const sun = new THREE.DirectionalLight("#fff2dd", 2.4);
sun.position.set(1, 3, 4);
scene.add(sun);
const back = new THREE.DirectionalLight("#fff2dd", 2.0);
back.position.set(-1, 3, -4);
scene.add(back);
const kit = await loadCrowdBody(renderer, "/models/people/Male_Adult_09.glb");
[["tiu", 0], ["reboot", 0], ["reboot", Math.PI]].forEach(([shirt, turn], i) => {
  const c = makeCharacter(kit, { uniform: true, shirt });
  const g = new THREE.Group();
  g.position.x = (i - 1) * 0.75;
  g.rotation.y = Math.PI + turn;
  g.add(c.model);
  scene.add(g);
  for (let k = 0; k < 10; k++) c.update(1 / 30, { speed: 0, grounded: true, turnRate: 0, facing: g.rotation.y });
});
const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 1.25, 4.6);
camera.lookAt(0, 1.15, 0);
renderer.render(scene, camera);
window.__done = ["ok"];
</script>
