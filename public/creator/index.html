<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechnoVerse character creator — phase 0</title>
<style>
  html,body{margin:0;height:100%;background:#15171a;color:#e8e6e1;font:13px/1.4 system-ui,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;left:0;top:0;bottom:0;width:260px;overflow:auto;padding:12px;background:#15171acc;backdrop-filter:blur(6px)}
  h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9b9a95;margin:14px 0 6px;font-weight:500}
  label{display:flex;justify-content:space-between;margin-top:6px}
  input[type=range]{width:100%;margin:0}
  button{margin:2px 2px 0 0;padding:4px 8px;background:#2a2d31;color:#e8e6e1;border:1px solid #3a3d42;border-radius:6px;cursor:pointer}
  button:hover{background:#34383d}
  #stats{position:fixed;right:10px;top:10px;font:12px ui-monospace,monospace;color:#b8b6b0;text-align:right;white-space:pre}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="stats"></div>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";
import { loadHB, DEFAULT_CONFIG } from "/creator/hb-runtime.js";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.78;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2d31);
const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
{ // soft studio environment for IBL
  const es = new THREE.Scene(); es.background = new THREE.Color(0x30343c);
  const box = (w, h, d, x, y, z, c, i) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(i) })); m.position.set(x, y, z); es.add(m); };
  box(8, 0.2, 8, 0, 6, 0, 0xffffff, 6); box(0.2, 5, 5, 6, 2, 2, 0xfff1e0, 7); box(0.2, 5, 5, -6, 2, 1, 0xcfe0ff, 3); box(5, 5, 0.2, 0, 2, -6, 0xffffff, 2); box(10, 0.2, 10, 0, -3, 0, 0x6b5a4a, 1.2);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, 0.04).texture; scene.environmentIntensity = 0.45;
}
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x4a4036, 0.3));
const sun = new THREE.DirectionalLight(0xfff0e0, 1.6); sun.position.set(2, 4, 3); scene.add(sun);
const rim = new THREE.DirectionalLight(0x9fb8ff, 0.8); rim.position.set(-3, 2, -3); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: 0x3a3d42, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

// minimal orbit
let yaw = 0.35, pitch = 0.08, dist = 4.6, target = new THREE.Vector3(0, 0.9, 0);
let drag = null;
canvas.addEventListener("pointerdown", (e) => (drag = [e.clientX, e.clientY]));
addEventListener("pointerup", () => (drag = null));
addEventListener("pointermove", (e) => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.006; pitch = Math.max(-0.5, Math.min(1.2, pitch + (e.clientY - drag[1]) * 0.004)); drag = [e.clientX, e.clientY]; });
canvas.addEventListener("wheel", (e) => { dist = Math.max(0.8, Math.min(9, dist * (1 + Math.sign(e.deltaY) * 0.08))); e.preventDefault(); }, { passive: false });
function placeCam() {
  cam.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  cam.lookAt(target);
}

const hb = await loadHB("/creator/");
let cfg = DEFAULT_CONFIG();
const root = hb.create(cfg);
scene.add(root);
const bind = hb.mesh.geometry.attributes.position.array.slice(); // bind positions (for stretch metric)

// ---- pose (procedural, only to check skinning under different bodies) ----
let poseMode = "walk", clock = 0, fixedT = null;
const Q = (ax, a) => new THREE.Quaternion().setFromAxisAngle(ax, a);
const X = new THREE.Vector3(1, 0, 0), Z = new THREE.Vector3(0, 0, 1);
function applyPose(t) {
  hb.bones.forEach((b) => b.quaternion.identity());
  if (poseMode === "t") return;
  const sw = Math.sin(t * 5.2), sw2 = Math.sin(t * 5.2 + Math.PI);
  const side = (name) => Math.sign(hb.headWorld[hb.man.bones.findIndex((b) => b.name === "mixamorig:" + name)].x - hb.headWorld[0].x) || 1;
  for (const S of ["Left", "Right"]) {
    const sgn = S === "Left" ? 1 : -1, s = S === "Left" ? sw : sw2;
    const iA = hb.man.bones.findIndex((b) => b.name === "mixamorig:" + S + "Arm"), iF = hb.man.bones.findIndex((b) => b.name === "mixamorig:" + S + "ForeArm");
    const bindDir = hb.headWorld[iF].clone().sub(hb.headWorld[iA]).normalize(); // the base mesh stands in an A-pose
    const down = new THREE.Quaternion().setFromUnitVectors(bindDir, new THREE.Vector3(sgn * 0.12, -1, 0).normalize());
    hb.bone(S + "Arm").quaternion.copy(Q(X, s * 0.45).multiply(down));
    hb.bone(S + "ForeArm").quaternion.copy(Q(X, -0.35 - Math.max(0, s) * 0.5));
    hb.bone(S + "UpLeg").quaternion.copy(Q(X, -s * 0.55));
    hb.bone(S + "Leg").quaternion.copy(Q(X, Math.max(0, s) * 0.9 + 0.08));
    hb.bone(S + "Foot").quaternion.copy(Q(X, -Math.max(0, s) * 0.3));
  }
  hb.bone("Spine").quaternion.copy(Q(new THREE.Vector3(0, 1, 0), sw * 0.12));
}
// manual skinning, to measure how much any edge stretches versus the bind pose
function stretch() {
  root.updateMatrixWorld(true); hb.skeleton.update();
  const M = hb.skeleton.boneMatrices, idx = hb.mesh.geometry.attributes.skinIndex.array, w = hb.mesh.geometry.attributes.skinWeight.array;
  const n = hb.nR, out = new Float32Array(n * 3), v = new THREE.Vector3(), a = new THREE.Matrix4(), acc = new THREE.Vector3();
  const P = hb.positions;
  for (let i = 0; i < n; i++) {
    acc.set(0, 0, 0);
    for (let k = 0; k < 4; k++) {
      const wt = w[i * 4 + k]; if (!wt) continue;
      a.fromArray(M, idx[i * 4 + k] * 16);
      acc.addScaledVector(v.set(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]).applyMatrix4(a), wt);
    }
    out.set([acc.x, acc.y, acc.z], i * 3);
  }
  const T = hb.mesh.geometry.index.array, r = [];
  let nan = 0; for (const x of out) if (!Number.isFinite(x)) nan++;
  for (let i = 0; i < T.length; i += 3) for (let e = 0; e < 3; e++) {
    const p = T[i + e], q = T[i + (e + 1) % 3];
    const b = Math.hypot(P[p * 3] - P[q * 3], P[p * 3 + 1] - P[q * 3 + 1], P[p * 3 + 2] - P[q * 3 + 2]);
    if (b < 1e-4) continue;
    r.push(Math.hypot(out[p * 3] - out[q * 3], out[p * 3 + 1] - out[q * 3 + 1], out[p * 3 + 2] - out[q * 3 + 2]) / b);
  }
  r.sort((x, y) => x - y);
  let minY = Infinity; for (let i = 0; i < n; i++) minY = Math.min(minY, out[i * 3 + 1]);
  return { nan, p50: +r[r.length >> 1].toFixed(3), p999: +r[Math.floor(r.length * 0.999)].toFixed(3), max: +r[r.length - 1].toFixed(2), min: +r[0].toFixed(2), minY: +minY.toFixed(3) };
}

// ---- UI ----
const ui = document.getElementById("ui");
const sliderSpec = [
  ["gender", "Gender", 0, 1, 0.5], ["heightCm", "Height (cm)", 140, 200, 168], ["weight", "Weight", 0, 1, 0.5], ["muscle", "Muscle", 0, 1, 0.5],
];
const inputs = {};
function addSlider(parent, id, label, min, max, val, on) {
  const l = document.createElement("label"); l.innerHTML = `<span>${label}</span><span class="v">${val.toFixed(2)}</span>`;
  const r = document.createElement("input"); r.type = "range"; r.min = min; r.max = max; r.step = 0.01; r.value = val;
  r.addEventListener("input", () => { l.querySelector(".v").textContent = (+r.value).toFixed(2); on(+r.value); });
  parent.append(l, r); inputs[id] = [r, l];
}
function rebuildUI() {
  ui.innerHTML = "<h2>Body</h2>";
  for (const [id, label, mn, mx, v] of sliderSpec) addSlider(ui, id, label, mn, mx, cfg[id] ?? v, (x) => { cfg[id] = x; dirty = true; });
  addSlider(ui, "skin", "Skin tone (light to dark)", 0, 1, cfg.skin ?? 0.35, (x) => { cfg.skin = x; hb.setSkin(x); });
  const es = document.createElement("select"); es.style.cssText = "width:100%;margin-top:6px"; ["brown", "darkbrown", "hazel", "green", "blue", "gray"].forEach((n) => es.add(new Option("Eyes: " + n, n))); es.value = cfg.eye ?? "brown"; es.onchange = () => { cfg.eye = es.value; hb.setEye(es.value); }; ui.append(es);
  const hs = document.createElement("select"); hs.style.cssText = "width:100%;margin-top:6px"; ["bald", "buzz", "short", "medium", "long", "authored1"].forEach((n) => hs.add(new Option("Hair: " + n, n))); hs.value = cfg.hair ?? "authored1";
  const hc = document.createElement("input"); hc.type = "color"; hc.value = cfg.hairColor ?? "#1c1410"; hc.style.cssText = "width:100%;margin-top:6px";
  const ah = () => { cfg.hair = hs.value; cfg.hairColor = hc.value; hb.setHair(cfg.hair, cfg.hairColor); }; hs.onchange = hc.oninput = ah; ui.append(hs, hc);
  // wardrobe: one dropdown per slot + a colour, from clothes/wardrobe.json
  fetch("/creator/clothes/wardrobe.json").then((r) => r.json()).then((W) => {
    for (const slot of Object.keys(W)) {
      const sel = document.createElement("select"); sel.style.cssText = "width:100%;margin-top:6px"; sel.add(new Option(slot + ": none", ""));
      for (const it of W[slot]) sel.add(new Option(slot + ": " + it.label, it.mhclo));
      const col = document.createElement("input"); col.type = "color"; col.value = "#ffffff"; col.style.cssText = "width:100%;margin-top:2px";
      sel.onchange = async () => { cfg.wear = cfg.wear || {}; cfg.wear[slot] = sel.value || null; await hb.wear(slot, sel.value ? "/creator/clothes/" + sel.value : null, { color: col.value === "#ffffff" ? undefined : col.value }); };
      col.oninput = () => hb.garmentColor(slot, col.value);
      ui.append(sel, col);
    }
  }).catch(() => {});
  ["African", "Asian", "Caucasian"].forEach((nm, i) => addSlider(ui, "race" + i, nm + " ancestry", 0, 1, cfg.race[i], (x) => { cfg.race[i] = x; dirty = true; }));
  ui.insertAdjacentHTML("beforeend", "<h2>Face</h2>");
  for (const s of hb.man.sliders) addSlider(ui, s.id, s.label, -1, 1, cfg.sliders[s.id] ?? 0, (x) => { cfg.sliders[s.id] = x; dirty = true; });
  ui.insertAdjacentHTML("beforeend", "<h2>Presets</h2>");
  PRESETS.forEach((p, i) => { const b = document.createElement("button"); b.textContent = p.name; b.onclick = () => preset(i); ui.append(b); });
  ui.insertAdjacentHTML("beforeend", "<h2>Pose</h2>");
  for (const m of ["walk", "t"]) { const b = document.createElement("button"); b.textContent = m === "t" ? "T-pose" : "Walk"; b.onclick = () => (poseMode = m); ui.append(b); }
  const rb = document.createElement("button"); rb.textContent = "Random face"; rb.onclick = () => { for (const s of hb.man.sliders) cfg.sliders[s.id] = +(Math.random() * 1.2 - 0.6).toFixed(2); dirty = true; rebuildUI(); }; ui.append(rb);
}
const PRESETS = [
  { name: "Default", c: { gender: 0.85, heightCm: 172, skin: 0.45 } },
  { name: "Short slim woman", c: { gender: 0.05, heightCm: 152, weight: 0.15, muscle: 0.3, skin: 0.55, eye: "darkbrown" } },
  { name: "Tall heavy man", c: { gender: 0.95, heightCm: 190, weight: 1, muscle: 0.5, skin: 0.7 } },
  { name: "Tall lean man", c: { gender: 1, heightCm: 195, weight: 0, muscle: 0.2, skin: 0.25, eye: "hazel" } },
  { name: "Short stocky man", c: { gender: 1, heightCm: 160, weight: 0.8, muscle: 0.9, skin: 0.6 } },
  { name: "Muscular woman", c: { gender: 0.1, heightCm: 176, weight: 0.5, muscle: 1, skin: 0.4, eye: "green" } },
];
function preset(i) { cfg = Object.assign(DEFAULT_CONFIG(), PRESETS[i].c); cfg.race = [1 / 3, 1 / 3, 1 / 3]; dirty = true; rebuildUI(); }
let dirty = false;
function applyCfg() {
  if (cfg.heightCm) hb.fitHeight(cfg, cfg.heightCm / 100);
  hb.update(cfg); hb.setSkin(cfg.skin ?? 0.35); hb.setEye(cfg.eye ?? "brown"); hb.setHair(cfg.hair ?? "authored1", cfg.hairColor ?? "#1c1410");
}
rebuildUI();

// ---- loop ----
const stats = document.getElementById("stats");
let frames = 0, last = performance.now(), fps = 0, updMs = 0;
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt; frames++;
  if (frames % 20 === 0) fps = Math.round(1 / Math.max(dt, 1e-3));
  if (dirty) { dirty = false; const t0 = performance.now(); applyCfg(); updMs = performance.now() - t0; target.set(0, hb.height * 0.52, 0); dist = Math.max(2.2, hb.height * 2.6); }
  applyPose(fixedT ?? clock);
  placeCam();
  renderer.render(scene, cam);
  stats.textContent = `${fps} fps   update ${updMs.toFixed(1)} ms\nheight ${hb.height.toFixed(2)} m   ${hb.man.bones.length} bones\n${hb.mesh.geometry.index.count / 3 | 0} triangles`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hooks
window.__hb = {
  hb, THREE, PRESETS,
  preset: (i) => { preset(i); dirty = false; const t0 = performance.now(); applyCfg(); updMs = performance.now() - t0; target.set(0, hb.height * 0.52, 0); dist = Math.max(2.2, hb.height * 2.6); return { height: +hb.height.toFixed(3), updMs: +updMs.toFixed(1) }; },
  pose: (m, t) => { poseMode = m; fixedT = t ?? null; },
  view: (y, p) => { yaw = y; pitch = p; },
  zoom: (d, ty) => { dist = d; target.set(0, ty, 0); },
  stretch: () => { applyPose(fixedT ?? clock); return stretch(); },
  config: (c) => { cfg = Object.assign(DEFAULT_CONFIG(), c); dirty = true; rebuildUI(); },
};
</script>
</body>
</html>
